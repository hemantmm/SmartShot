[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartshot"
version = "0.1.0"
description = "A macOS app and CLI that renames screenshots based on their content."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hemant Mehta" },
]
keywords = ["macos", "screenshots", "ocr", "gui", "cli", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]

dependencies = [
  "watchdog>=4.0.0",
]

[project.optional-dependencies]
# macOS OCR via Apple Vision (recommended on macOS)
vision = [
  "pyobjc-core>=10.0; platform_system=='Darwin'",
  "pyobjc-framework-Cocoa>=10.0; platform_system=='Darwin'",
  "pyobjc-framework-Quartz>=10.0; platform_system=='Darwin'",
  "pyobjc-framework-Vision>=10.0; platform_system=='Darwin'",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.0.0",
]

[project.scripts]
smartshot = "smartshot.cli:main"
smartshot-app = "smartshot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
